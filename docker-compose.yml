services:
  dnd-api:
    image: dnd-api:latest
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${PORT:-5207}:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=${DATABASE_URL}
      - Jwt__Key=${JWT_KEY:-DEVELOPMENT_SECRET_KEY_FOR_JWT_AUTHENTICATION_MIN_32_CHARS!}
    restart: unless-stopped


