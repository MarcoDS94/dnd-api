name: Build and Deploy to Cloud Run

on:
  push:
    branches:
      - main

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  GAR_LOCATION: europe-west1               # GCP region for Artifact Registry (e.g. europe-west1, us-central1)
  GAR_REPOSITORY: dnd-api-repo             # Artifact Registry Docker repository name
  SERVICE_NAME: dnd-api                    # Cloud Run service name
  REGION: europe-west1                     # Cloud Run service region

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      # 1. Setup .NET 8 SDK and verify the solution compiles
      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore and Build Solution
        run: |
          dotnet restore DndBackend.sln
          dotnet build DndBackend.sln --no-restore -c Release

      # 2. Authenticate to Google Cloud using Service Account credentials
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      # 3. Configure Docker to authenticate with Google Artifact Registry
      - name: Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker ${{ env.GAR_LOCATION }}-docker.pkg.dev --quiet

      # 4. Build and Push Production Docker Image (using standard production Dockerfile)
      - name: Build and Push Docker Image
        run: |
          IMAGE_URI="${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.GAR_REPOSITORY }}/${{ env.SERVICE_NAME }}"
          TAG_SHA="${IMAGE_URI}:${{ github.sha }}"
          TAG_LATEST="${IMAGE_URI}:latest"

          docker build -t "$TAG_SHA" -t "$TAG_LATEST" -f Dockerfile .
          docker push "$TAG_SHA"
          docker push "$TAG_LATEST"

      # 5. Deploy container revision to Google Cloud Run
      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICE_NAME }}
          region: ${{ env.REGION }}
          image: ${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.GAR_REPOSITORY }}/${{ env.SERVICE_NAME }}:${{ github.sha }}
          flags: |
            --allow-unauthenticated
            --min-instances=0
            --max-instances=5
            --memory=512Mi
            --cpu=1
            --set-env-vars=ASPNETCORE_ENVIRONMENT=Production,EnableSwagger=true
            --set-secrets=ConnectionStrings__DefaultConnection=DND_DB_CONNECTION:latest,Jwt__Key=DND_JWT_KEY:latest

